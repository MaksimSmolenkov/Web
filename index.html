<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализация Стека</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Визуализация Стека</h1>
    
    <!-- Ввод элемента и кнопки управления стеком -->
    <div class="controls">
        <input type="text" id="elementInput" placeholder="Введите элемент">
        <button onclick="pushElement()">Добавить</button>
        <button onclick="popElement()">Удалить</button>
    </div>

    <!-- Контейнер для отображения стека -->
    <div id="stackContainer" class="stack"></div>

    <script src="script.js"></script>
</body>
</html>
